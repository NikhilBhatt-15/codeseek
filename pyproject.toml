[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "codeseek"
dynamic = ["version"]
description = "Local semantic code search powered by EmbeddingGemma 2. Nothing leaves your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikhil Bhatt" }]
requires-python = ">=3.10"
keywords = ["code-search", "embeddings", "semantic-search", "gemma", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=1.26",
    "pathspec>=1.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# In-process backend. Not needed when using Ollama.
torch = [
    "sentence-transformers>=6.0",
    "transformers>=5.0",
    "torch>=2.4",
    # transformers builds EmbeddingGemma 2's image and video processors even when the
    # vision encoder is skipped, so these are needed for text-only use too.
    "pillow>=10.0",
    "torchvision>=0.19",
]
mcp = ["mcp>=2.0"]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
codeseek = "codeseek.cli:main"
codeseek-mcp = "codeseek.mcp_server:main"

[project.urls]
Homepage = "https://github.com/NikhilBhatt-15/codeseek"
Issues = "https://github.com/NikhilBhatt-15/codeseek/issues"

[tool.hatch.version]
path = "src/codeseek/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codeseek"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["model: requires downloading the real EmbeddingGemma 2 weights"]
